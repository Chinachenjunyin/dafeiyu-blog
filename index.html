<title>大肥鱼的博客</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#23233A; --night:#1B2340; --amber:#E8A24B; --violet:#9B8AC4;
    --sea:#4A7FB5; --paper:#FBF7F0; --paper-dim:#F3EDE2;
    --ink-soft:rgba(35,35,58,.68); --line:rgba(35,35,58,.14);
    --serif:"Noto Serif SC",serif; --sans:"Noto Sans SC",sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--night);-webkit-font-smoothing:antialiased;overflow-x:hidden}
  /* fixed background layer */
  .bg{position:fixed;inset:0;z-index:-2;overflow:hidden}
  .bg img{width:100%;height:112%;object-fit:cover;object-position:center 18%;animation:kenburns 42s ease-in-out infinite alternate;will-change:transform}
  .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(27,35,64,.12),rgba(27,35,64,.34) 62%,rgba(27,35,64,.62))}
  @keyframes kenburns{from{transform:scale(1.02) translateY(0)}to{transform:scale(1.1) translateY(-2.2%)}}
  /* hero */
  .hero{min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;padding:0 clamp(20px,5vw,64px) clamp(36px,7vh,72px);color:#fff}
  .hero .kicker{font-size:12px;letter-spacing:.42em;color:rgba(255,255,255,.82);margin:0 0 14px}
  .hero h1{font-family:var(--serif);font-weight:900;font-size:clamp(44px,9vw,96px);line-height:1.08;margin:0;text-shadow:0 2px 30px rgba(27,35,64,.45)}
  .hero h1 .gold{color:var(--amber)}
  .hero .sub{margin:18px 0 0;font-size:clamp(14px,2.4vw,17px);font-weight:300;line-height:1.9;color:rgba(255,255,255,.9);max-width:34em}
  .hero .scroll-hint{margin-top:34px;display:inline-flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.28em;color:rgba(255,255,255,.75)}
  .hero .scroll-hint::after{content:"";width:1px;height:34px;background:linear-gradient(180deg,rgba(255,255,255,.7),transparent);animation:drip 2.2s ease-in-out infinite}
  @keyframes drip{0%{transform:scaleY(.3);transform-origin:top}55%{transform:scaleY(1)}100%{transform:scaleY(.3);transform-origin:top}}
  /* paper sheet */
  .sheet{background:var(--paper);border-radius:28px 28px 0 0;margin-top:-26px;position:relative;box-shadow:0 -18px 60px rgba(27,35,64,.35);padding:clamp(34px,6vw,72px) clamp(20px,5vw,64px) 80px;min-height:56vh}
  .sheet-inner{max-width:860px;margin:0 auto}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:16px}
  .sec-head h2{font-family:var(--serif);font-weight:700;font-size:clamp(24px,4.5vw,34px);margin:0}
  .sec-head .count{font-size:13px;color:var(--ink-soft);white-space:nowrap}
  /* empty state */
  .empty{padding:clamp(44px,8vh,84px) 8px;text-align:center}
  .empty svg{width:64px;height:64px;margin-bottom:22px}
  .empty h3{font-family:var(--serif);font-weight:700;font-size:clamp(20px,3.6vw,26px);margin:0 0 12px}
  .empty p{margin:0 auto;max-width:26em;font-size:15px;line-height:2;color:var(--ink-soft);font-weight:300}
  .empty .rule{width:44px;height:2px;background:var(--amber);margin:26px auto 0;border-radius:2px}
  /* about */
  .about{margin-top:clamp(40px,7vh,64px);display:grid;grid-template-columns:1fr;gap:18px;border-top:1px solid var(--line);padding-top:clamp(28px,5vh,44px)}
  @media(min-width:640px){.about{grid-template-columns:180px 1fr}}
  .about h2{font-family:var(--serif);font-weight:700;font-size:22px;margin:0}
  .about p{margin:0;font-size:15px;line-height:2;color:var(--ink-soft);font-weight:300}
  .about p strong{color:var(--ink);font-weight:500}
  footer{margin-top:clamp(44px,8vh,72px);border-top:1px solid var(--line);padding-top:22px;display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between;font-size:12.5px;color:var(--ink-soft)}
  /* reveal — hidden state only applies once JS arms it, so content is never stuck invisible */
  .rv-armed .rv{opacity:0;transform:translateY(18px);transition:opacity .8s cubic-bezier(.22,1,.36,1),transform .8s cubic-bezier(.22,1,.36,1)}
  .rv-armed .rv.in{opacity:1;transform:none}
  .hero .rv{transition-delay:calc(var(--d,0)*120ms)}
  @media(prefers-reduced-motion:reduce){
    .bg img{animation:none}.hero .scroll-hint::after{animation:none}
    .rv{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}
  }
</style>

<script>
  (function(){
    var els = document.querySelectorAll('.rv');
    document.documentElement.classList.add('rv-armed');
    // Safety net: nothing stays hidden, whatever the scroll does.
    setTimeout(function(){ els.forEach(function(e){ e.classList.add('in'); }); }, 1600);
    if (!('IntersectionObserver' in window)) {
      els.forEach(function(e){ e.classList.add('in'); });
    } else {
      var io = new IntersectionObserver(function(entries){
        entries.forEach(function(en){
          if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); }
        });
      }, { threshold: 0.12 });
      els.forEach(function(e){ io.observe(e); });
    }
    // gentle parallax on the fixed background
    var img = document.getElementById('bgImg'), ticking = false;
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!reduce) {
      window.addEventListener('scroll', function(){
        if (ticking) return; ticking = true;
        requestAnimationFrame(function(){
          var y = Math.min(window.scrollY, window.innerHeight);
          img.style.translate = '0 ' + (y * -0.06) + 'px';
          ticking = false;
        });
      }, { passive: true });
    }
  })();
</script>
